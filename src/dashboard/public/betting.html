<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Simulation - BetVariationAnalytic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .stat-value.positive {
            color: #10b981;
        }

        .stat-value.negative {
            color: #ef4444;
        }

        .bets-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #e5e7eb;
            color: #333;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .bets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .bets-table th {
            background: #f3f4f6;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        .bets-table td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .bets-table tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge.win {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.loss {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .level-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 700;
        }

        .level-1 { background: #dbeafe; color: #1e40af; }
        .level-2 { background: #fef3c7; color: #92400e; }
        .level-3 { background: #fee2e2; color: #991b1b; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #667eea;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .bets-table {
                font-size: 0.85em;
            }
            
            .bets-table th,
            .bets-table td {
                padding: 10px 5px;
            }

            h1 {
                font-size: 1.8em;
            }

            .stat-value {
                font-size: 2em;
            }
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Betting Simulation</h1>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Bankroll Actuelle</div>
                <div class="stat-value" id="current-bankroll">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ROI Total</div>
                <div class="stat-value" id="total-roi">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Taux de Réussite</div>
                <div class="stat-value" id="win-rate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Paris</div>
                <div class="stat-value" id="total-bets">-</div>
            </div>
        </div>

        <div class="chart-container">
            <h2>📈 Évolution de la Bankroll</h2>
            <canvas id="bankroll-chart"></canvas>
        </div>

        <div class="bets-container">
            <h2>📊 Historique des Paris</h2>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="win">Gagnés</button>
                <button class="filter-btn" data-filter="loss">Perdus</button>
                <button class="filter-btn" data-filter="pending">En attente</button>
                <button class="filter-btn" data-filter="level3">Niveau 3</button>
                <button class="filter-btn" data-filter="level2">Niveau 2</button>
            </div>

            <div id="bets-list">
                <div class="loading">Chargement...</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadBets()" title="Actualiser">
        ⟳
    </button>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let currentFilter = 'all';
        let allBets = [];
        let bankrollChart = null;

        async function loadBets() {
            try {
                const response = await fetch('/api/bets');
                const data = await response.json();
                
                allBets = data.bets || [];
                updateStats(data.stats);
                updateChart(data.bets);
                filterBets(currentFilter);
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('bets-list').innerHTML = `
                    <div class="empty-state">
                        <p>❌ Erreur de chargement</p>
                    </div>
                `;
            }
        }

        function updateStats(stats) {
            if (!stats) return;

            document.getElementById('current-bankroll').textContent = 
                stats.currentBankroll.toFixed(2) + '€';
            
            const roiElement = document.getElementById('total-roi');
            roiElement.textContent = (stats.roi >= 0 ? '+' : '') + stats.roi.toFixed(2) + '%';
            roiElement.className = 'stat-value ' + (stats.roi >= 0 ? 'positive' : 'negative');
            
            document.getElementById('win-rate').textContent = stats.winRate.toFixed(1) + '%';
            document.getElementById('total-bets').textContent = stats.totalBets;
        }

        function updateChart(bets) {
            const ctx = document.getElementById('bankroll-chart').getContext('2d');
            
            // Trier par date
            const sortedBets = [...bets]
                .filter(b => b.result !== null)
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            const labels = sortedBets.map((b, i) => `Pari ${i + 1}`);
            const bankrollData = sortedBets.map(b => b.bankroll);

            if (bankrollChart) {
                bankrollChart.destroy();
            }

            bankrollChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Bankroll (€)',
                        data: bankrollData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function filterBets(filter) {
            currentFilter = filter;
            
            // Mettre à jour les boutons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                }
            });

            // Filtrer les paris
            let filtered = allBets;
            if (filter === 'win') filtered = allBets.filter(b => b.result === 'won');
            else if (filter === 'loss') filtered = allBets.filter(b => b.result === 'lost');
            else if (filter === 'pending') filtered = allBets.filter(b => b.result === null);
            else if (filter === 'level3') filtered = allBets.filter(b => b.alert_level === 3);
            else if (filter === 'level2') filtered = allBets.filter(b => b.alert_level === 2);

            displayBets(filtered);
        }

        function displayBets(bets) {
            const container = document.getElementById('bets-list');

            if (bets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📭 Aucun pari pour ce filtre</p>
                    </div>
                `;
                return;
            }

            const table = `
                <table class="bets-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Match</th>
                            <th>Niveau</th>
                            <th>Pari</th>
                            <th>Cote</th>
                            <th>Mise</th>
                            <th>Résultat</th>
                            <th>Profit</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bets.map(bet => `
                            <tr>
                                <td>${new Date(bet.timestamp).toLocaleDateString('fr-FR', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}</td>
                                <td><strong>${bet.event_name}</strong></td>
                                <td><span class="level-badge level-${bet.alert_level}">N${bet.alert_level}</span></td>
                                <td>${bet.outcome}</td>
                                <td>${bet.adjusted_odds.toFixed(2)}</td>
                                <td>${bet.bet_size.toFixed(2)}€</td>
                                <td>
                                    ${bet.result === null 
                                        ? '<span class="status-badge pending">En attente</span>'
                                        : bet.result === 'won'
                                        ? '<span class="status-badge win">✓ Gagné</span>'
                                        : '<span class="status-badge loss">✗ Perdu</span>'
                                    }
                                    ${bet.home_score !== null ? `<br><small>${bet.home_score}-${bet.away_score}</small>` : ''}
                                </td>
                                <td style="color: ${bet.profit > 0 ? '#10b981' : '#ef4444'}; font-weight: bold;">
                                    ${bet.profit !== null ? (bet.profit > 0 ? '+' : '') + bet.profit.toFixed(2) + '€' : '-'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => filterBets(btn.dataset.filter));
        });

        // Charger au démarrage
        loadBets();

        // Auto-refresh toutes les 30 secondes
        setInterval(loadBets, 30000);
    </script>
</body>
</html>
