<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetVariationAnalytic - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header h1 { color: #667eea; font-size: 2.5em; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .value { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .chart-container { background: white; border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .alerts-container { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 5px 15px; }
        .alert-item { border-left: 4px solid #ff6b6b; padding: 15px; margin-bottom: 15px; background: #fff5f5; border-radius: 5px; }
        .refresh-btn { position: fixed; bottom: 30px; right: 30px; background: #667eea; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 BetVariationAnalytic</h1>
            <p>Système de monitoring intelligent des variations de cotes sportives</p>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>Total Alertes</h3><div class="value" id="totalAlerts">-</div></div>
        </div>
        <div class="chart-container"><h2>📊 Répartition des Alertes par Sport</h2><canvas id="sportsChart" height="80"></canvas></div>
        <div class="alerts-container"><h2>🚨 Alertes Récentes</h2><div id="alertsList"></div></div>
        <button class="refresh-btn" onclick="loadData()">🔄 Actualiser</button>
    </div>
    <script>
        async function loadData() {
            const [alerts, stats] = await Promise.all([
                fetch('/api/alerts/recent?limit=50').then(r => r.json()),
                fetch('/api/alerts/stats').then(r => r.json())
            ]);
            document.getElementById('totalAlerts').textContent = stats.total;
        }
        loadData();
    </script>
</body>
</html>
